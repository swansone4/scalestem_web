<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">Airflow around a computational teardrop model</title>
  <desc id="desc">A streamlined teardrop airfoil with simulated flow lines curving above and below it.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7cfe1"/>
      <stop offset="1" stop-color="#789bb8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#e8e3d7"/>
    </linearGradient>
    <clipPath id="field-clip"><rect x="12" y="12" width="736" height="376" rx="7"/></clipPath>
    <filter id="soft-shadow" x="-20%" y="-30%" width="150%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 7 4 0 8" fill="none" stroke="#f7f5ee" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect x="12" y="12" width="736" height="376" rx="7" fill="url(#field)"/>
  <g clip-path="url(#field-clip)" fill="none" stroke="#f8f7f1" stroke-width="2" opacity=".85" marker-end="url(#arrow)">
    <path d="M-18 45 C145 44 189 52 245 76 C334 114 472 121 778 107"/>
    <path d="M-25 82 C137 81 183 91 239 112 C326 147 451 156 778 148"/>
    <path d="M-30 119 C128 118 173 129 224 146 C307 176 420 191 778 188"/>
    <path d="M-32 158 C117 157 158 169 203 181 C276 201 386 210 778 220"/>
    <path d="M-35 199 C113 198 153 197 198 197 C300 197 454 199 778 202"/>
    <path d="M-32 240 C117 241 158 229 203 217 C276 197 386 188 778 178"/>
    <path d="M-30 279 C128 280 173 269 224 252 C307 222 420 207 778 210"/>
    <path d="M-25 316 C137 317 183 307 239 286 C326 251 451 242 778 250"/>
    <path d="M-18 353 C145 354 189 346 245 322 C334 284 472 277 778 291"/>
  </g>
  <g fill="none" stroke="#f3e58e" stroke-width="2.3" opacity=".94">
    <path d="M-28 139 C132 138 176 151 225 167 C290 188 409 198 778 197"/>
    <path d="M-28 259 C132 260 176 247 225 231 C290 210 409 200 778 201"/>
  </g>
  <path d="M217 199 C224 165 255 150 309 154 C385 159 472 188 558 199 C472 211 385 240 309 245 C255 249 224 233 217 199Z" fill="#263d56" opacity=".18" transform="translate(0 7)" filter="url(#soft-shadow)"/>
  <path d="M217 199 C224 165 255 150 309 154 C385 159 472 188 558 199 C472 211 385 240 309 245 C255 249 224 233 217 199Z" fill="url(#body)" stroke="#263d56" stroke-width="3"/>
  <path d="M218 199 C309 195 427 195 554 199" fill="none" stroke="#263d56" stroke-width="1.3" stroke-dasharray="6 7" opacity=".55"/>
  <circle cx="218" cy="199" r="4" fill="#f3e58e" stroke="#263d56" stroke-width="1.5"/>
  <g fill="#263d56" font-family="Georgia,serif">
    <text x="34" y="45" font-size="14" letter-spacing="2">COMPUTATIONAL AERODYNAMICS</text>
    <text x="726" y="366" text-anchor="end" font-size="12" letter-spacing="1.5">AIRFLOW · SIMULATED</text>
  </g>
</svg>
